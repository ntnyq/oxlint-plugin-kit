name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Check release tag
        run: |
          node --input-type=commonjs -e '
            const { version } = require("./package.json")
            if (process.env.GITHUB_REF_NAME !== "v" + version) {
              throw new Error("Release tag must match package.json version " + version)
            }
          '

      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check
      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          case "${version%%+*}" in
            *-*) pnpm publish --no-git-checks --tag next ;;
            *) pnpm publish --no-git-checks ;;
          esac

  release-notes:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - run: pnpm dlx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
